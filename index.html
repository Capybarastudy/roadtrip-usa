<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Road Trip USA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;700;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Patrick+Hand&display=swap">
<style>
/* Layout: a highway sign gantry over a road map. Green guide signs carry headings, interstate shields mark the stations, an odometer counts the miles. */
:root{
  --ground:#e7edf0; --card:#ffffff; --ink:#1c2328; --muted:#56636c; --hair:#c9d3d9;
  --sign:#0c6a3c; --sign-2:#0a5a33; --sign-ink:#ffffff;
  --shield:#1c4d8f; --shield-red:#c51a2e; --stripe:#f2b705;
  --asphalt:#2c3236; --land:#d9e4cf; --land-edge:#a9bb9a; --water:#cfe1ee;
  --good:#1d7f47; --good-bg:#e2f3e8; --bad:#b9352a; --bad-bg:#fbe7e4;
  --gold:#b8860b; --gold-bg:#fff4d1; --silver:#6b7a86; --silver-bg:#eef2f5;
  --gap:#fff3c4;
  --f-sign:"Overpass", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#171b1e; --card:#22282c; --ink:#e7ecef; --muted:#9eabb3; --hair:#3a4349;
  --sign:#127a46; --sign-2:#0e663a; --sign-ink:#ffffff;
  --shield:#2e64ad; --shield-red:#d8384a; --stripe:#f2b705;
  --asphalt:#3d454b; --land:#27332b; --land-edge:#3f5244; --water:#18252e;
  --good:#4fc283; --good-bg:#16301f; --bad:#ef7a6c; --bad-bg:#3a1d1a;
  --gold:#f0c04a; --gold-bg:#3a3010; --silver:#b4c0c8; --silver-bg:#2b3338;
  --gap:#4a3f12; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#171b1e; --card:#22282c; --ink:#e7ecef; --muted:#9eabb3; --hair:#3a4349;
  --sign:#127a46; --sign-2:#0e663a; --sign-ink:#ffffff;
  --shield:#2e64ad; --shield-red:#d8384a; --stripe:#f2b705;
  --asphalt:#3d454b; --land:#27332b; --land-edge:#3f5244; --water:#18252e;
  --good:#4fc283; --good-bg:#16301f; --bad:#ef7a6c; --bad-bg:#3a1d1a;
  --gold:#f0c04a; --gold-bg:#3a3010; --silver:#b4c0c8; --silver-bg:#2b3338;
  --gap:#4a3f12; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-sign);text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--stripe);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:12px 20px;font-family:var(--f-sign);font-weight:800;font-size:17px;letter-spacing:.02em;
  background:var(--sign);color:var(--sign-ink);box-shadow:0 3px 0 var(--sign-2);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sign-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--hair);box-shadow:0 3px 0 var(--hair)}
.btn.blue{background:var(--shield);box-shadow:0 3px 0 #123565}
.btn.small{padding:8px 14px;font-size:15px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:var(--r);padding:20px;border:1px solid var(--hair)}

/* Highway guide sign */
.sign{background:var(--sign);color:var(--sign-ink);border-radius:16px;padding:18px 22px;border:3px solid var(--sign-ink);
  box-shadow:0 0 0 3px var(--sign), 0 8px 20px rgba(0,0,0,.18);position:relative}
.sign .eyebrow{font-family:var(--f-sign);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.sign h1{font-size:clamp(34px,7vw,60px);font-weight:900;letter-spacing:-.01em}
.sign h2{font-size:clamp(24px,4.5vw,34px);font-weight:900}
.exit-tab{position:absolute;top:-20px;right:22px;background:var(--sign);color:var(--sign-ink);border:3px solid var(--sign-ink);
  border-bottom:0;border-radius:10px 10px 0 0;padding:2px 12px;font-family:var(--f-sign);font-weight:800;font-size:14px;letter-spacing:.08em}

.cityart{display:block;width:100%;height:auto;border-radius:10px}
.sign.st{display:flex;justify-content:space-between;align-items:center;gap:16px}
.sign.st .artbox{width:170px;flex:none;border:3px solid var(--sign-ink);border-radius:12px;overflow:hidden;line-height:0}
@media (max-width:520px){.sign.st .artbox{width:110px}}
.stop .thumb{width:58px;flex:none;line-height:0;border-radius:8px;overflow:hidden}
.bigart{width:min(320px,100%);border-radius:14px;overflow:hidden;line-height:0;border:1px solid var(--hair)}
.map .car{pointer-events:none}
/* Start */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:stretch}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero .sign{display:flex;flex-direction:column;gap:10px;justify-content:center;min-width:0}
.arrow-line{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--f-sign);font-weight:700;font-size:18px}
.arrow-line span::before{content:"↑ ";opacity:.85}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700}
input[type=text],textarea{font:inherit;font-size:19px;padding:12px 14px;border-radius:10px;border:2px solid var(--hair);background:var(--card);color:var(--ink);width:100%}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.rules{grid-template-columns:1fr}}
.rule{display:flex;gap:12px;align-items:flex-start}
.rule b{font-family:var(--f-sign);font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--sign);white-space:nowrap}

/* Dashboard */
.dash{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
@media (max-width:700px){.dash{grid-template-columns:1fr}}
.odo{background:var(--asphalt);color:#fff;border-radius:12px;padding:10px 16px;display:flex;flex-direction:column;align-items:flex-start;min-width:190px}
.odo small{font-family:var(--f-sign);letter-spacing:.16em;font-size:12px;opacity:.8;font-weight:700}
.odo .digits{font-family:var(--f-sign);font-weight:900;font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:.08em;line-height:1}
.odo .digits span{background:#14181b;border-radius:4px;padding:2px 4px;margin-right:2px;display:inline-block}
.who{font-family:var(--f-sign);font-weight:800;font-size:20px}

/* Map */
.mapcard{padding:10px;overflow:hidden}
.map{width:100%;height:auto;display:block}
.map .land{fill:var(--land);stroke:var(--land-edge);stroke-width:2;stroke-linejoin:round}
.map .sea{fill:var(--water)}
.map .road{fill:none;stroke:var(--asphalt);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.map .road.todo{opacity:.28}
.map .lane{fill:none;stroke:var(--stripe);stroke-width:2;stroke-dasharray:9 8;stroke-linecap:round}
.map .lane.todo{opacity:.3}
.map .lbl{font-family:var(--f-sign);font-weight:800;font-size:17px;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:5px;stroke-linejoin:round}
.map .sublbl{font-family:var(--f-body);font-size:12.5px;fill:var(--muted);paint-order:stroke;stroke:var(--land);stroke-width:4px}
.map .pin{cursor:pointer}
.map .pin.locked{cursor:not-allowed}
.map .pin.locked .shield-body{fill:var(--silver)}
.map .pin.locked .shield-top{fill:var(--silver)}
.map .pin:not(.locked):hover .shield-g{transform:scale(1.12)}
.map .shield-g{transition:transform .15s;transform-box:fill-box;transform-origin:center}
.map .ring{fill:none;stroke:var(--stripe);stroke-width:4}
@media (prefers-reduced-motion:no-preference){.map .ring{animation:pulse 1.6s ease-out infinite}}
@keyframes pulse{0%{r:20;opacity:1}100%{r:34;opacity:0}}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);padding:6px 8px 2px}

/* Station list (compact, below map) */
.stops{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.stop{display:flex;gap:10px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:10px 12px;color:var(--ink)}
.stop[disabled]{opacity:.5;cursor:not-allowed}
.stop .t{font-family:var(--f-sign);font-weight:800;font-size:16px;line-height:1.15}
.stop .s{font-size:13.5px;color:var(--muted)}
.stop .sc{margin-left:auto;font-family:var(--f-sign);font-weight:800;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);white-space:nowrap}

/* Passport */
.passport{display:flex;gap:10px;flex-wrap:wrap}
.stamp{width:86px;height:86px;border-radius:50%;border:3px dashed var(--hair);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--f-sign);font-weight:900;font-size:12px;text-align:center;line-height:1.05;color:var(--muted);transform:rotate(-8deg);padding:6px}
.stamp.gold{border:3px solid var(--gold);color:var(--gold);background:var(--gold-bg)}
.stamp.silver{border:3px solid var(--silver);color:var(--silver);background:var(--silver-bg)}
.stamp.plain{border:3px solid var(--sign);color:var(--sign)}
.stamp .big{font-size:15px;letter-spacing:.02em}
.stamp:nth-child(even){transform:rotate(7deg)}

/* Question */
.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;background:var(--hair)}
.dot.ok{background:var(--good)} .dot.half{background:var(--stripe)} .dot.no{background:var(--bad)} .dot.now{outline:3px solid var(--shield);outline-offset:1px}
.qcard{display:flex;flex-direction:column;gap:16px}
.qnum{font-family:var(--f-sign);font-weight:800;letter-spacing:.12em;font-size:13px;color:var(--muted);text-transform:uppercase}
.qtext{font-size:22px;line-height:1.55;max-width:44em}
.gap{display:inline-block;min-width:110px;border-bottom:3px solid var(--ink);background:var(--gap);border-radius:4px 4px 0 0;padding:0 8px;text-align:center;font-weight:700}
.clue{font-size:16px;color:var(--muted);background:var(--ground);border-radius:8px;padding:6px 12px;display:inline-block}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--hair);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 16px;font-size:19px;text-align:left}
.opt:hover:not([disabled]){border-color:var(--shield)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);text-decoration:line-through}
.opt.right{border-color:var(--good);background:var(--good-bg);font-weight:700}
.opt[disabled]{cursor:default}
.tfn{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tfn .opt{text-align:center;font-family:var(--f-sign);font-weight:800}
.fb{border-radius:12px;padding:14px 16px;font-size:17px}
.fb.ok{background:var(--good-bg);border:2px solid var(--good)}
.fb.no{background:var(--bad-bg);border:2px solid var(--bad)}
.fb.try{background:var(--gold-bg);border:2px solid var(--gold)}
.fb b.h{font-family:var(--f-sign);font-weight:900;font-size:19px;display:block;margin-bottom:2px}
.textbox{border-left:5px solid var(--stripe);background:var(--ground);border-radius:0 12px 12px 0;padding:14px 18px;font-size:17px;line-height:1.6;max-height:none}
.textbox p{margin:0 0 10px}
.textbox h3{font-size:22px;margin-bottom:6px}
details.read summary{cursor:pointer;font-weight:700;color:var(--shield)}

/* Rush */
.rushtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.timer{font-family:var(--f-sign);font-weight:900;font-size:42px;font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--hair);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--stripe);transition:width .25s linear}
.deword{font-family:var(--f-sign);font-weight:900;font-size:clamp(28px,6vw,44px);text-align:center;padding:14px 0}
.rushgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.rushgrid{grid-template-columns:1fr}}

/* End / certificate */
.cert{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.code{font-family:var(--f-sign);font-weight:900;font-size:clamp(28px,7vw,46px);letter-spacing:.08em;background:var(--asphalt);color:#fff;border-radius:12px;padding:10px 20px;
  font-variant-numeric:tabular-nums;user-select:all;word-break:break-all}

/* Board */
.board{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:56px 1fr auto auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:10px 14px}
.brow .rk{font-family:var(--f-sign);font-weight:900;font-size:22px;text-align:center;color:#fff;background:var(--shield);border-radius:8px 8px 18px 18px;padding:4px 0}
.brow:nth-child(1) .rk{background:var(--gold)} .brow:nth-child(2) .rk{background:var(--silver)} .brow:nth-child(3) .rk{background:#a0612b}
.brow .nm{font-family:var(--f-sign);font-weight:800;font-size:22px;min-width:0;overflow-wrap:anywhere}
.brow .pt{font-family:var(--f-sign);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums}
.beamer .brow .nm,.beamer .brow .pt{font-size:32px}
.beamer .brow .rk{font-size:30px}
.del{background:none;border:1px solid var(--hair);color:var(--muted);border-radius:8px;padding:4px 10px;font-size:14px}
.del.arm{border-color:var(--bad);color:var(--bad);font-weight:700}
.log{font-size:15px;display:flex;flex-direction:column;gap:4px}
.log .ok{color:var(--good)} .log .no{color:var(--bad)}
footer{text-align:center;font-size:14px;color:var(--muted)}
footer a{color:var(--muted)}

/* ===== World: sky, sun, clouds, ground ===== */
:root{--sky-a:#86c8f0;--sky-b:#e3f4fc;--sun-x:22%;--sun-y:34%;--sun-c:#ffe066;--sun-glow:rgba(255,230,120,.5);--stars:0;--dim:1;--veil:0;--cloud:#ffffff;--f-hand:"Patrick Hand","Bradley Hand","Marker Felt","Comic Sans MS",cursive}
.world{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.w-sky,.s-sky{position:absolute;inset:0;background:linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 78%);transition:background 1.5s}
.stars{position:absolute;inset:0;opacity:var(--stars);transition:opacity 1.5s;
  background-image:radial-gradient(1.6px 1.6px at 20px 30px,#fff 50%,transparent 52%),radial-gradient(1.2px 1.2px at 90px 80px,#fff 50%,transparent 52%),radial-gradient(1.5px 1.5px at 160px 20px,#fff 50%,transparent 52%),radial-gradient(1px 1px at 230px 110px,#fff 50%,transparent 52%),radial-gradient(1.3px 1.3px at 60px 125px,#fff 50%,transparent 52%);
  background-size:260px 150px}
.w-sun{position:absolute;left:var(--sun-x);top:var(--sun-y);width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;background:var(--sun-c);box-shadow:0 0 70px 26px var(--sun-glow);transition:left 1.5s,top 1.5s,background 1.5s}
.cloud{position:absolute;left:0;width:150px;height:46px;background:var(--cloud);border-radius:46px;opacity:.9;transition:background 1.5s}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:64px;height:64px;left:24px;top:-30px}
.cloud::after{width:48px;height:48px;left:76px;top:-20px}
.world .cloud{animation:drift linear infinite}
.world .c1{top:7%;animation-duration:120s;animation-delay:-30s}
.world .c2{top:19%;animation-duration:170s;animation-delay:-100s;opacity:.7}
.world .c3{top:33%;animation-duration:140s;animation-delay:-65s;opacity:.55}
.world .c4{top:12%;animation-duration:200s;animation-delay:-160s;opacity:.8}
@keyframes drift{from{transform:translateX(-240px)}to{transform:translateX(calc(100vw + 240px))}}
.w-ground{position:absolute;left:0;right:0;bottom:0;width:100%;height:24vh;filter:brightness(var(--dim));transition:filter 1.5s}
.wrap{position:relative;z-index:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
#snd{position:fixed;right:calc(14px + env(safe-area-inset-right, 0px));bottom:calc(14px + env(safe-area-inset-bottom, 0px));z-index:25;width:50px;height:50px;border-radius:50%;
  border:2px solid var(--hair);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.18)}
#snd.on{background:var(--sign);color:#fff;border-color:var(--sign)}
.dash,.qhead{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:10px 14px}
footer{background:var(--card);border:1px solid var(--hair);border-radius:999px;padding:6px 16px;align-self:center}
.qarea{display:flex;flex-direction:column;gap:18px}

/* ===== Driving strip ===== */
.strip{position:relative;height:172px;border-radius:16px;overflow:hidden;border:3px solid var(--card);box-shadow:0 6px 18px rgba(0,0,0,.16);isolation:isolate}
.strip.tall{height:230px}
.s-sun{position:absolute;left:var(--sun-x);top:var(--sun-y);width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--sun-c);box-shadow:0 0 40px 14px var(--sun-glow);transition:all 1.5s}
.strip .cloud{top:16px;animation:sdrift 48s linear infinite}
.strip .sc2{top:46px;animation-duration:74s;animation-delay:-36s;opacity:.7}
@keyframes sdrift{from{transform:translateX(1100px) scale(.55)}to{transform:translateX(-240px) scale(.55)}}
.s-far{position:absolute;left:0;bottom:30px;width:1600px;height:80px;animation:scroll calc(var(--spd) * 4) linear infinite;filter:brightness(var(--dim));transition:filter 1.5s}
.s-mid{position:absolute;left:0;bottom:27px;width:1600px;height:60px;animation:scroll var(--spd) linear infinite;filter:brightness(var(--dim));transition:filter 1.5s}
.s-far svg,.s-mid svg{display:block;width:1600px}
.s-far svg{height:80px} .s-mid svg{height:60px}
@keyframes scroll{to{transform:translateX(-800px)}}
.farsvg{fill:#86b47a}.farsvg.skyline{fill:#73828e}.farsvg.mountains{fill:#7f95a6}.farsvg.mesa{fill:#c98a5c}.farsvg.sea{fill:#3fa7d6}
.s-road{position:absolute;left:0;right:0;bottom:0;height:30px;background:#3a4146;border-top:3px solid #8c9396;overflow:hidden}
.s-road::after{content:"";position:absolute;left:0;top:12px;height:3px;width:calc(100% + 52px);background:repeating-linear-gradient(90deg,#f2b705 0 26px,transparent 26px 52px);animation:dash calc(var(--spd) * .065) linear infinite}
@keyframes dash{to{transform:translateX(-52px)}}
.s-car{position:absolute;bottom:5px;left:calc(2% + var(--prog, 0) * 54%);width:128px;z-index:2;transition:left 1s cubic-bezier(.34,1.35,.5,1)}
.s-car svg{display:block;width:100%;height:auto}
.s-car .body{animation:bob .32s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2px)}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .45s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.s-car.shake{animation:shake .55s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-3deg)}40%{transform:translateX(7px) rotate(2deg)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.puff{position:absolute;bottom:16px;width:24px;height:24px;border-radius:50%;background:rgba(110,110,110,.6);z-index:1;animation:puff 1.1s ease-out forwards}
@keyframes puff{to{transform:translate(-56px,-34px) scale(2.8);opacity:0}}
.s-bill{position:absolute;right:3%;bottom:27px;width:124px;z-index:1;display:flex;flex-direction:column;align-items:center}
.s-bill .board{background:#fff;border:3px solid #2c3236;border-radius:8px;padding:3px;width:100%}
.s-bill .board svg{border-radius:4px}
.s-bill .lab{font-family:var(--f-sign);font-weight:900;font-size:11.5px;color:#fff;background:#0c6a3c;text-align:center;border-radius:4px;margin-top:3px;padding:2px 4px;letter-spacing:.04em;line-height:1.15}
.s-bill .legs{display:flex;gap:64px}.s-bill .legs i{display:block;width:5px;height:12px;background:#5b4636}

/* ===== Locals & postcard ===== */
.local{display:flex;gap:12px;align-items:flex-start}
.ava{width:76px;height:76px;flex:none}
.bubble{position:relative;flex:1;min-width:0;background:var(--card);border:2px solid var(--hair);border-radius:16px;padding:12px 16px}
.bubble::before{content:"";position:absolute;left:-11px;top:24px;border:9px solid transparent;border-right-color:var(--hair);border-left:0}
.bubble .nm{font-family:var(--f-sign);font-weight:900;font-size:18px;color:var(--shield)}
.bubble p{margin:4px 0 0}
.bubble .hand{font-family:var(--f-hand);font-size:22px;line-height:1.3}
.postcard{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);padding:18px 20px;transform:rotate(-1.2deg);box-shadow:0 8px 20px rgba(0,0,0,.12);min-width:0}
.postcard .pc-stamp{float:right;width:96px;margin:0 0 8px 12px;padding:4px;border:2px dashed var(--hair);transform:rotate(4deg);line-height:0;background:var(--card)}
.postcard p{font-family:var(--f-hand);font-size:22px;line-height:1.35;margin:0}
.postcard .from{text-align:right;margin-top:6px}

/* ===== Map extras ===== */
.map .veil{fill:#0b1430;opacity:var(--veil);pointer-events:none;transition:opacity 1.5s}
.map .mcloud{animation:mdrift linear infinite;pointer-events:none}
@keyframes mdrift{from{transform:translateX(-140px)}to{transform:translateX(900px)}}
.map .plane{animation:fly 28s linear infinite;pointer-events:none}
@keyframes fly{0%{transform:translate(-90px,96px)}100%{transform:translate(860px,30px)}}
.map .wave{fill:none;stroke:#ffffff;stroke-width:2;stroke-linecap:round;animation:wv 3.2s ease-in-out infinite}
@keyframes wv{0%,100%{transform:translateX(0);opacity:.15}50%{transform:translateX(6px);opacity:.8}}
.map .bob{animation:mbob .5s ease-in-out infinite alternate}
@keyframes mbob{to{transform:translateY(-1.5px)}}
@media (prefers-reduced-motion:reduce){
  .cloud,.map .mcloud,.map .plane,.map .wave,.map .bob,.s-far,.s-mid,.s-road::after,.wheel,.s-car .body,.s-car.shake,.puff{animation:none!important}
}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom, 0px));background:var(--asphalt);color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;z-index:20}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{0%{transform:scale(.4) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
}

<p><b>4</b> One evening we went to a baseball game. I didn’t understand the rules at all, but the hot dogs were great and the fans were really loud. Ella cheered her team on the whole time.</p>

function mapSVG(){
  const land = US.map(([a,b])=>P(a,b).map(v=>v.toFixed(1)).join(",")).join(" ");
  const pts = STATIONS.map(s=>P(s.lon,s.lat));
  let roads="";
  for(let i=0;i<pts.length-1;i++){
    const [x1,y1]=pts[i],[x2,y2]=pts[i+1]; const mx=(x1+x2)/2, my=(y1+y2)/2; const dx=x2-x1, dy=y2-y1;
    const cx=mx-dy*.12, cy=my+dx*.12; const d=`M${x1},${y1} Q${cx},${cy} ${x2},${y2}`;
    const todo = done(STATIONS[i].id) ? "" : " todo";
    roads += `<path class="road${todo}" id="leg-${i}" d="${d}"/><path class="lane${todo}" d="${d}"/>`;
  }
  const next = STATIONS.findIndex(s=>!done(s.id));
  let pins="";
  STATIONS.forEach((s,i)=>{
    const [x,y]=pts[i]; const lk=!unlocked(i); const m=medal(s);
    const lx = s.lab==="l" ? -26 : (s.lab==="b"||s.lab==="t") ? 0 : 26; const anchor = s.lab==="l"?"end":(s.lab==="b"||s.lab==="t")?"middle":"start"; const ly = s.lab==="b" ? 44 : s.lab==="t" ? -48 : 2;
    const badge = done(s.id) ? `<circle cx="15" cy="-15" r="9" fill="var(--${m==="gold"?"gold":m==="silver"?"silver":"good"})" stroke="#fff" stroke-width="2"/><path d="M10.5,-15 l3,3 l6,-6" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>` : "";
    pins += `<g class="pin${lk?" locked":""}" data-i="${i}" transform="translate(${x},${y})" tabindex="${lk?-1:0}" role="button" aria-label="Station ${i+1}: ${s.city}, ${s.topic}${lk?" (locked)":""}">
      ${i===next && !lk ? `<circle class="ring" r="20"/>` : ""}${shield(i+1)}${badge}
      <text class="lbl" x="${lx}" y="${ly}" text-anchor="${anchor}">${s.city}</text>
      <text class="sublbl" x="${lx}" y="${ly+16}" text-anchor="${anchor}">${s.topic}</text></g>`;
  });
  return `<svg class="map" viewBox="0 0 760 420" role="img" aria-label="Map of the USA with the stations of the road trip">
    <rect class="sea" x="0" y="0" width="760" height="420" rx="10"/>
    ${waves()}<polygon class="land" points="${land}"/>
    ${roads}${mapFx()}<g class="car" id="car" transform="translate(-50 -50)"><g class="bob">
      <ellipse cx="0" cy="1.5" rx="15" ry="8.5" fill="rgba(0,0,0,.22)"/>
      <rect x="-14" y="-7.5" width="28" height="15" rx="4.5" fill="#f6c423" stroke="#2c3236" stroke-width="1.6"/>
      <rect x="3" y="-6" width="6.5" height="12" rx="1.6" fill="#bfe0f5"/><rect x="-10" y="-6" width="5" height="12" rx="1.6" fill="#bfe0f5"/>
      <rect x="-3.5" y="-3.5" width="5" height="7" rx="1" fill="#2c3236"/>
      <circle cx="13.5" cy="-4.5" r="1.4" fill="#fff6c2"/><circle cx="13.5" cy="4.5" r="1.4" fill="#fff6c2"/></g></g>${pins}</svg>`;
}

/* ---------- the taxi on the map ---------- */
function setCar(path, len){
  const car=document.getElementById("car"); if(!car||!path) return;
  const L=path.getTotalLength(); const p=path.getPointAtLength(len), q=path.getPointAtLength(Math.min(L,len+1.5)), o=path.getPointAtLength(Math.max(0,len-1.5));
  const ang=Math.atan2(q.y-o.y,q.x-o.x)*180/Math.PI;
  car.setAttribute("transform",`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${ang.toFixed(1)}) scale(1.25)`);
}
function legEnds(path){ const L=path.getTotalLength(); const a=Math.min(34,L*.2); return [a, L-a] }
function placeCar(){
  const next=STATIONS.findIndex(s=>!done(s.id));
  if(next===0){ const p=document.getElementById("leg-0"); if(p) setCar(p, legEnds(p)[0]); return }
  const leg = next===-1 ? STATIONS.length-2 : next-1; const p=document.getElementById("leg-"+leg); if(p) setCar(p, legEnds(p)[1]);
}
function driveCar(leg, cb){ play("horn");
  const path=document.getElementById("leg-"+leg); if(!path){ cb&&cb(); return }
  const [a,b]=legEnds(path);
  if(reduced){ setCar(path,b); cb&&cb(); return }
  const dur=Math.min(3400, 1200+path.getTotalLength()*3.2); const t0=performance.now();
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  (function f(now){ const t=Math.min(1,(now-t0)/dur); setCar(path, a+(b-a)*ease(t)); if(t<1 && document.getElementById("car")) requestAnimationFrame(f); else cb&&cb() })(t0);
}

/* ---------- confetti & fireworks ---------- */
const FX={c:null,x:null,p:[],run:false};
const CONF=["#f2b705","#d6281c","#1c4d8f","#0c6a3c","#ff8a3d","#9b5de5","#3fcf7b","#ffffff"];
function fxInit(){
  FX.c=document.getElementById("fx"); if(!FX.c) return; FX.x=FX.c.getContext("2d");
  const rs=()=>{ const d=window.devicePixelRatio||1; FX.c.width=innerWidth*d; FX.c.height=innerHeight*d; FX.x.setTransform(d,0,0,d,0,0) };
  rs(); addEventListener("resize",rs);
}
function burst(x,y,n=40,spread=1,up=1){
  if(reduced||!FX.x) return;
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=(2+Math.random()*5)*spread;
    FX.p.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3*up,life:60+Math.random()*45,age:0,s:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,col:CONF[(Math.random()*CONF.length)|0],shape:Math.random()<.5}) }
  if(!FX.run){ FX.run=true; requestAnimationFrame(fxTick) }
}
function fxTick(){
  const x=FX.x; x.clearRect(0,0,innerWidth,innerHeight);
  FX.p=FX.p.filter(p=>p.age<p.life);
  for(const p of FX.p){ p.age++; p.vy+=.18; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
    x.save(); x.globalAlpha=Math.max(0,1-p.age/p.life); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.col;
    if(p.shape) x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); else { x.beginPath(); x.arc(0,0,p.s/2.4,0,7); x.fill() } x.restore() }
  if(FX.p.length) requestAnimationFrame(fxTick); else { FX.run=false; x.clearRect(0,0,innerWidth,innerHeight) }
}
function rain(n=150){ if(reduced) return; for(let i=0;i<n;i++) setTimeout(()=>burst(Math.random()*innerWidth, -10, 1, .5, -.4), i*10) }
function fireworks(k=7){ if(reduced) return; for(let i=0;i<k;i++) setTimeout(()=>{ burst(innerWidth*(.15+.7*Math.random()), innerHeight*(.15+.3*Math.random()), 80, 1.4, 0); play("pop") }, i*480) }

let AC=null; let SOUND=false; try{ SOUND=localStorage.getItem("rt-sound")==="1" }catch(e){}
function tone(f,d,type="sine",vol=.14,when=0){
  const t=AC.currentTime+when; const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.05);
}
const SFX={
  ok(){ tone(660,.12,"triangle"); tone(990,.2,"triangle",.14,.09) },
  bad(){ tone(170,.28,"sawtooth",.07); tone(120,.3,"sawtooth",.06,.08) },
  horn(){ tone(392,.18,"square",.05); tone(392,.25,"square",.05,.24) },
  stamp(){ tone(90,.18,"square",.12) },
  pop(){ tone(1200+Math.random()*600,.15,"triangle",.07) },
  fanfare(){ [523,659,784,1047].forEach((f,i)=>tone(f,.25,"triangle",.13,i*.13)) }
};
function play(n){ if(!SOUND) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); SFX[n]&&SFX[n]() }catch(e){} }
function sndBtn(){
  const b=document.getElementById("snd"); if(!b) return;
  const on=`<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
  const off=`<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
  const draw=()=>{ b.innerHTML=SOUND?on:off; b.classList.toggle("on",SOUND); b.setAttribute("aria-pressed",SOUND?"true":"false") };
  draw(); b.onclick=()=>{ SOUND=!SOUND; try{ localStorage.setItem("rt-sound",SOUND?"1":"0") }catch(e){} draw(); if(SOUND) play("ok"); toast(SOUND?"Sound on":"Sound off") };
}

/* ---------- Station play ---------- */
let R = null;
function startStation(i){
  const st=STATIONS[i];
  R = { i, st, k:0, score:0, fuel:6, marks:[], finished:false, items: st.items.map(it=> it.t==="choice" ? {...it, order: shuffle(it.o.map((_,j)=>j))} : {...it}) };
  renderShell(); renderItem();
}
function renderShell(){
  const {st,i}=R;
  app.innerHTML = `<div class="sign" style="padding:14px 20px"><div class="exit-tab">EXIT ${i+1}</div>
    <div class="eyebrow">${st.city}, ${st.state} · ${esc(st.sub)}</div><h2>${st.topic}</h2></div>
    ${strip(st.id,{fuel:true,bill:billLive(st)})}
    <div class="qhead"><div class="dots" id="dots"></div>
      <div class="row"><span class="odo" style="min-width:0;padding:6px 12px"><small>THIS STATION</small><span class="digits" id="sodo" style="font-size:24px">${odo(0)}</span></span>
      <button class="btn alt small" id="quit">Back to map</button></div></div>
    <div id="qarea" class="qarea"></div>${footer()}`;
  $("#quit").onclick=()=>{ if(R.finished || confirmQuit()) go("map") };
  hud();
}
function hud(){
  const N=R.items.length; const answered=R.marks.filter(Boolean).length;
  const d=$("#dots"); if(d) d.innerHTML=R.items.map((_,j)=>`<span class="dot ${R.marks[j]||""} ${j===R.k&&!R.finished?"now":""}"></span>`).join("");
  const o=$("#sodo"); if(o) o.innerHTML=odo(R.score);
  const f=$("#sfuel"); if(f) f.innerHTML=`<span>FUEL</span>${[0,1,2,3,4,5].map(j=>`<i class="${j<R.fuel?(R.fuel<=2?"low":"on"):""}"></i>`).join("")}`;
  const b=$("#blab"); if(b) b.textContent = answered<N ? `${R.st.city.toUpperCase()} · ${N-answered} mi` : `WELCOME TO ${R.st.city.toUpperCase()}!`;
  setProg(Math.min(1, answered/N));
}
function renderItem(){
  const {st,k}=R; const it=R.items[k];
  it.tries=0; it.hinted=false; it.closed=false;
  const gapq = it.q.replace("___", `<span class="gap" id="gap">&nbsp;</span>`);
  let body="";
  if(it.t==="type"){
    body = `<div class="qtext">${gapq}</div>${it.clue?`<div><span class="clue">${esc(it.clue)}</span></div>`:""}
      <input type="text" id="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer">
      <div class="row"><button class="btn" id="check">Check</button><button class="btn alt small" id="hint">Hint (max. +50)</button></div>`;
  } else if(it.t==="choice"){
    body = `<div class="qtext">${gapq}</div><div class="opts">${it.order.map(j=>`<button class="opt" data-j="${j}">${it.o[j]}</button>`).join("")}</div>
      <div class="row"><button class="btn alt small" id="hint">Hint: remove one wrong answer (max. +50)</button></div>`;
  } else {
    body = `<div class="qtext">${it.q}</div><div class="tfn">${["True","False","Not in the text"].map((l,j)=>`<button class="opt" data-j="${j}">${l}</button>`).join("")}</div>`;
  }
  const L=LOCALS[st.id];
  const intro = k===0 ? `<div class="local">${avatar(L)}<div class="bubble"><b class="nm">${L.name}</b><p class="hand">${esc(L.line)}</p><p class="muted" style="font-size:15px">${esc(st.intro)}</p></div></div>` : "";
  const textBlock = st.text ? `<details class="read" open><summary>The text</summary><div class="textbox">${st.text}</div></details>` : "";
  $("#qarea").innerHTML = `${intro}${textBlock}<div class="card qcard"><div class="qnum">Question ${k+1} of ${R.items.length}</div>${body}<div id="fb" aria-live="polite"></div><div id="nextrow"></div></div>`;
  hud();
  if(it.t==="type"){
    const a=$("#ans"); a.focus({preventScroll:true});
    $("#check").onclick=()=>checkType(); a.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); it.closed? next() : checkType() } });
    $("#hint").onclick=()=>{ it.hinted=true; $("#hint").disabled=true; fb("try","Hint", `<span style="font-family:var(--f-sign);font-size:22px;letter-spacing:.05em">${esc(hintOf(it.a[0]))}</span>`); a.focus() };
  } else {
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>checkChoice(b));
    const h=$("#hint"); if(h) h.onclick=()=>{ it.hinted=true; h.disabled=true; const wrong=[...app.querySelectorAll(".opt:not([disabled])")].filter(b=>+b.dataset.j!==it.c); if(wrong.length){ const w=wrong[Math.floor(Math.random()*wrong.length)]; w.disabled=true; w.classList.add("wrong") } };
  }
}
let quitArmed=0;
function confirmQuit(){ const b=$("#quit"); if(Date.now()-quitArmed<3000) return true; quitArmed=Date.now(); b.textContent="Tap again to leave (points are lost)"; return false }
function fb(cls,head,html){ $("#fb").innerHTML=`<div class="fb ${cls}"><b class="h">${head}</b>${html}</div>` }
function mistake(){
  const before=R.fuel; R.fuel=Math.max(0,R.fuel-1); hud(); play("bad"); shakeCar();
  if(before>0 && R.fuel===0) toast("Out of fuel – no fuel bonus in this city!");
  else if(R.fuel===2) toast("Fuel is getting low!");
}
function award(correct){
  const it=R.items[R.k]; it.closed=true;
  let pts=0;
  if(correct){ pts = (it.tries===0 && !it.hinted) ? PER : HALF; R.marks[R.k] = pts===PER ? "ok" : "half" } else { R.marks[R.k]="no" }
  R.score += pts; hud();
  if(correct){ play("ok"); carSparkle(pts===PER?34:16) }
  $("#nextrow").innerHTML = `<button class="btn" id="next">${R.k<R.items.length-1?"Next question →":"Arrive in "+R.st.city}</button>`;
  $("#next").onclick=next; $("#next").focus({preventScroll:true});
  const h=$("#hint"); if(h) h.disabled=true;
  return pts;
}
function checkType(){
  const it=R.items[R.k]; if(it.closed) return; const a=$("#ans"); const v=a.value;
  if(!v.trim()){ toast("Type an answer first."); return }
  const ok = it.a.some(x=>norm(x)===norm(v)); const g=$("#gap"); const sol=it.a[0].replace(/'/g,"’");
  if(ok){ const p=award(true); if(g) g.textContent=sol; a.disabled=true; $("#check").disabled=true; fb("ok", p===PER?"Great! +100 miles":"Correct! +50 miles", esc(it.ex)) }
  else if(it.tries===0){ it.tries=1; mistake(); fb("try","Not quite – try again (max. +50)", `Check the form and the spelling. Clue: ${esc(it.clue||"")}`); a.select() }
  else { mistake(); award(false); if(g) g.textContent=sol; a.disabled=true; $("#check").disabled=true; fb("no","The answer is: "+esc(sol), esc(it.ex)) }
}
function checkChoice(btn){
  const it=R.items[R.k]; if(it.closed) return; const j=+btn.dataset.j;
  const labels = it.t==="tfn" ? ["True","False","Not in the text"] : it.o;
  if(j===it.c){ btn.classList.add("right"); const p=award(true); app.querySelectorAll(".opt").forEach(b=>b.disabled=true);
    const g=$("#gap"); if(it.t==="choice" && g) g.textContent=it.o[it.c].replace(/\?$/,"");
    fb("ok", p===PER?"Great! +100 miles":"Correct! +50 miles", esc(it.ex)) }
  else { btn.classList.add("wrong"); btn.disabled=true; mistake();
    const left=[...app.querySelectorAll(".opt:not([disabled])")];
    if(it.tries===0 && left.length>1){ it.tries=1; fb("try","Not quite – try again (max. +50)", it.t==="tfn"?"Find the sentence in the text first.":"Look carefully at the verb form.") }
    else { award(false); app.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; if(+b.dataset.j===it.c) b.classList.add("right") });
      fb("no","Correct answer: "+esc(labels[it.c]), esc(it.ex)) } }
}
function next(){ if(R.k<R.items.length-1){ R.k++; renderItem(); window.scrollTo({top:0, behavior:reduced?"auto":"smooth"}) } else finishStation() }
function finishStation(){
  const {st,score,i}=R; R.finished=true;
  const bonus=R.fuel*25, tot=score+bonus;
  const prev=S.best[st.id]; const prevTot=prev?.score; const firstTime = prev===undefined; const newBest = firstTime || tot>prevTot;
  if(newBest){ S.best[st.id]={score:tot, base:score}; if(firstTime && i<STATIONS.length-1) S.drive=i; save() }
  const pct=Math.round(score/maxOf(st)*100); const m=pct>=80?"gold":pct>=50?"silver":"plain";
  const nxt=STATIONS[i+1];
  hud(); applyTOD(); $("#quit").textContent="Map";
  play("stamp");
  if(m==="gold") setTimeout(()=>{ rain(170); play("fanfare") }, 500); else setTimeout(()=>burst(innerWidth/2, innerHeight*.35, 50), 400);
  $("#qarea").innerHTML = `<div class="local">${avatar(LOCALS[st.id])}<div class="bubble"><b class="nm">${LOCALS[st.id].name}</b><p class="hand">${pct>=80?"Wow, your English is fantastic! Have a safe trip!":pct>=50?"Well done! Come back and get the gold stamp!":"Thanks for visiting! Practise a bit more and come back."}</p></div></div>
  <div class="card cert">
    <div class="stamp ${m} ${reduced?"":"pop"}" style="width:130px;height:130px;font-size:15px"><span class="big" style="font-size:19px">${st.city.toUpperCase()}</span><span>${m==="gold"?"GOLD":m==="silver"?"SILVER":"VISITED"}</span></div>
    <h2 style="font-size:30px">${pct>=80?"Fantastic driving!":pct>=50?"Good job!":"You made it!"}</h2>
    <div class="board" style="width:min(420px,100%)">
      <div class="brow" style="grid-template-columns:1fr auto"><span>Questions (${pct}%)</span><span class="pt" style="font-size:20px">${score}</span></div>
      <div class="brow" style="grid-template-columns:1fr auto"><span>Fuel bonus: ${R.fuel} × 25</span><span class="pt" style="font-size:20px">+${bonus}</span></div>
      <div class="brow" style="grid-template-columns:1fr auto;border-color:var(--sign)"><b>Total</b><span class="pt" style="font-size:24px">${tot}</span></div>
    </div>
    <p style="margin:0" class="muted">${prev!==undefined?(newBest?"New personal best!":`Your best in ${st.city} is still ${prevTot}.`):""} ${pct<80?"Play again for a gold stamp – only your best result counts.":""}</p>
    <div class="row" style="justify-content:center">
      ${nxt?`<button class="btn" id="nextst">Drive on to ${nxt.city} →</button>`:`<button class="btn" id="tocode">Get my leaderboard code</button>`}
      <button class="btn alt" id="again">Play again</button><button class="btn alt" id="tomap">Map</button></div>
  </div>`;
  if(nxt) $("#nextst").onclick=()=> S.drive!=null ? go("map",{autoOpen:i+1}) : go("station",i+1); else $("#tocode").onclick=()=>go("code");
  $("#again").onclick=()=>go("station",i); $("#tomap").onclick=()=>go("map");
}

/* ---------- Taxi Rush ---------- */
let RU=null;
function renderRushIntro(){
  app.innerHTML = `<div class="sign"><div class="exit-tab">BONUS</div><div class="eyebrow">Vocabulary race · German → English</div><h2>Taxi Rush</h2></div>
  ${strip("rush",{prog:.1, spd:6})}
  <div class="card" style="display:flex;flex-direction:column;gap:12px">
    <p style="margin:0;font-size:19px">You have <b>${RUSH_SEC} seconds</b>. Pick the English word for the German word as fast as you can. Every correct word pushes the taxi forward – a mistake sends it back!</p>
    <p style="margin:0" class="muted">+20 miles for every correct word · +30 bonus for every 5 in a row · only your <b>best</b> Taxi Rush counts${S.rushBest?` (now: ${S.rushBest})`:""}.</p>
    <div class="row"><button class="btn blue" id="go">Start the taxi</button><button class="btn alt" id="rback">Map</button></div>
  </div>${footer()}`;
  $("#go").onclick=startRush; $("#rback").onclick=()=>go("map");
}
function startRush(){
  RU={score:0, streak:0, right:0, wrong:0, end:Date.now()+RUSH_SEC*1000, deck:shuffle(RUSH), p:0, missed:[]};
  play("horn");
  app.innerHTML = `<div class="sign" style="padding:14px 20px"><div class="exit-tab">BONUS</div><div class="eyebrow">Vocabulary race · German → English</div><h2>Taxi Rush</h2></div>
  ${strip("rush",{prog:.1, spd:5})}
  <div class="card" style="display:flex;flex-direction:column;gap:14px">
    <div class="rushtop"><div class="timer" id="tm">${RUSH_SEC}</div><div class="odo" style="min-width:0"><small>MILES</small><span class="digits" id="rs">${odo(0)}</span></div></div>
    <div class="bar"><i id="bar" style="width:100%"></i></div>
    <div class="deword" id="de"></div><div class="rushgrid" id="rg"></div><div id="streak" class="muted" style="text-align:center;min-height:1.5em"></div></div>`;
  rushQ(); RU.tick=setInterval(()=>{ const left=Math.max(0,RU.end-Date.now()); const tm=$("#tm"); if(!tm){ clearInterval(RU.tick); return } tm.textContent=Math.ceil(left/1000); $("#bar").style.width=(left/(RUSH_SEC*10))+"%"; if(left<=0) endRush() },200);
}
function rushQ(){
  if(RU.p>=RU.deck.length){ RU.deck=shuffle(RUSH); RU.p=0 }
  const [de,en]=RU.deck[RU.p++]; const others=shuffle(RUSH.filter(x=>x[1]!==en)).slice(0,3).map(x=>x[1]);
  const opts=shuffle([en,...others]); RU.cur=en; RU.lock=false;
  $("#de").textContent=de;
  $("#rg").innerHTML=opts.map(o=>`<button class="opt" style="text-align:center">${esc(o)}</button>`).join("");
  $("#rg").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(RU.lock) return; RU.lock=true; const ok=b.textContent===RU.cur;
    if(ok){ RU.score+=20; RU.streak++; RU.right++; b.classList.add("right"); play("ok"); setProg(Math.min(.92,.1+RU.streak*.08));
      if(RU.streak%5===0){ RU.score+=30; $("#streak").textContent=`${RU.streak} in a row! +30 bonus`; carSparkle(40) } else $("#streak").textContent=RU.streak>1?`${RU.streak} in a row`:"" }
    else { RU.streak=0; RU.wrong++; b.classList.add("wrong"); play("bad"); shakeCar(); setProg(.1); RU.missed.push([$("#de").textContent,RU.cur]); $("#rg").querySelectorAll(".opt").forEach(x=>{ if(x.textContent===RU.cur) x.classList.add("right") }); $("#streak").textContent="" }
    $("#rs").innerHTML=odo(RU.score);
    setTimeout(()=>{ if(Date.now()<RU.end && $("#rg")) rushQ() }, ok?250:900);
  });
}
function endRush(){
  clearInterval(RU.tick); const nb = RU.score>(S.rushBest||0); if(nb){ S.rushBest=RU.score; save() }
  const miss=[...new Map(RU.missed.map(m=>[m[1],m])).values()];
  app.innerHTML = `<div class="sign"><div class="exit-tab">BONUS</div><div class="eyebrow">Time is up!</div><h2>Taxi Rush: ${RU.score} miles</h2></div>
  ${strip("rush",{prog:.5, spd:9})}
  <div class="card" style="display:flex;flex-direction:column;gap:12px">
    <p style="margin:0;font-size:19px">${RU.right} correct · ${RU.wrong} wrong · ${nb?"<b>New best!</b>":`Your best: ${S.rushBest}`}</p>
    ${miss.length?`<div><b>Learn these words again:</b><ul style="margin:6px 0 0">${miss.map(m=>`<li>${esc(m[0])} = <b>${esc(m[1])}</b></li>`).join("")}</ul></div>`:""}
    <div class="row"><button class="btn blue" id="ragain">Again</button><button class="btn alt" id="rback">Map</button></div></div>${footer()}`;
  if(nb && RU.score>0){ play("fanfare"); rain(120) }
  $("#ragain").onclick=startRush; $("#rback").onclick=()=>go("map");
}

/* ---------- Code ---------- */
function renderCode(){
  const n=STATIONS.filter(s=>done(s.id)).length; const golds=STATIONS.filter(s=>medal(s)==="gold").length;
  app.innerHTML = `<div class="sign"><div class="exit-tab">FINISH</div><div class="eyebrow">Road Trip USA · Unit 1</div><h2>Your leaderboard code</h2></div>
  ${strip("la",{prog:n===STATIONS.length?.8:.3, spd:n===STATIONS.length?14:8, bill:billStatic("la", n===STATIONS.length?"YOU MADE IT!":"KEEP DRIVING …")})}
  <div class="card cert">
    <p style="margin:0;font-size:19px">Driver <b>${esc(S.nick)}</b> · ${n} of ${STATIONS.length} cities · ${golds} gold stamps · Taxi Rush ${S.rushBest||0}</p>
    <div class="odo"><small>TOTAL MILES</small><div class="digits">${odo(total())}</div></div>
    <div class="code" id="code">${makeCode()}</div>
    <p style="margin:0" class="muted">Send this code to your teacher or show it on your iPad. It only works with your nickname and your exact miles – you can’t change it.</p>
    ${n<STATIONS.length?`<p style="margin:0"><b>Tip:</b> You haven’t visited every city yet. More stations = more miles!</p>`:""}
    <div class="row" style="justify-content:center"><button class="btn" id="copy">Copy code</button><button class="btn alt" id="back">Map</button></div>
    <div class="passport" style="justify-content:center">${STATIONS.map(s=>{ const m=medal(s); return `<div class="stamp ${m}"><span class="big">${m?s.city.toUpperCase():"·"}</span>${m?`<span>${m==="gold"?"GOLD":m==="silver"?"SILVER":"VISITED"}</span>`:`<span>${s.city}</span>`}</div>` }).join("")}</div>
  </div>${footer()}`;
  $("#back").onclick=()=>go("map");
  if(n===STATIONS.length) setTimeout(()=>{ fireworks(8); play("fanfare") }, 450);
  $("#copy").onclick=()=>{ const c=makeCode(); try{ navigator.clipboard.writeText(c).then(()=>toast("Code copied"),()=>sel()) }catch(e){ sel() } };
  function sel(){ const r=document.createRange(); r.selectNodeContents($("#code")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Code selected – copy it now") }
}

/* ================= TEACHER & BOARD (owner only, db) ================= */
let DB=null, USER=null, OWNER=false, BOARD=[], unsub=null, ready=null, LOCAL=false;
/* Outside Claude (e.g. GitHub Pages): the leaderboard is saved in this browser only. */
function localDB(){
  const K="roadtrip-u1-board"; const subs=[];
  const read=()=>{ try{ return JSON.parse(localStorage.getItem(K)||"{}") }catch(e){ return {} } };
  const write=o=>{ try{ localStorage.setItem(K, JSON.stringify(o)) }catch(e){} subs.forEach(f=>f(snap())) };
  const snap=()=>{ const o=read(); return { docs:Object.keys(o).map(id=>({id, data:()=>o[id]})) } };
  return { collection:()=>({
    doc:id=>({ set:async d=>{ const o=read(); o[id]=d; write(o) }, delete:async()=>{ const o=read(); delete o[id]; write(o) } }),
    onSnapshot:f=>{ subs.push(f); setTimeout(()=>f(snap()),0); return ()=>{} } }) };
}
function initCaps(){
  if(ready) return ready;
  ready = (async()=>{ try{
    for(let t=0; t<15 && !window.claude?.use; t++) await new Promise(r=>setTimeout(r,100));
    if(!window.claude?.use){ DB=localDB(); OWNER=true; LOCAL=true;
      if(!unsub){ unsub = DB.collection("board").onSnapshot(q=>{ BOARD=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.score-a.score||a.nick.localeCompare(b.nick)); if(view==="teacher") drawTeacherBoard(); if(view==="board") drawBeamer() }) }
      return; }
    [DB,USER] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    OWNER = USER ? await USER.isOwner() : false;
    if(DB && !unsub){ unsub = DB.collection("board").onSnapshot(q=>{ BOARD=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.score-a.score||a.nick.localeCompare(b.nick)); if(view==="teacher") drawTeacherBoard(); if(view==="board") drawBeamer() }, ()=>{}) }
  }catch(e){} })();
  return ready;
}
function boardRows(withDel){
  if(!BOARD.length) return `<div class="card muted">No codes yet. When your students finish, paste their codes ${withDel?"above":"on the teacher page"} – the leaderboard fills up here.</div>`;
  return BOARD.map((r,i)=>`<div class="brow"><div class="rk">${i+1}</div><div class="nm">${esc(r.nick)}</div><div class="pt">${r.score}</div>${withDel?`<button class="del" data-id="${esc(r.id)}">Remove</button>`:"<span></span>"}</div>`).join("");
}
async function renderTeacher(){
  view="teacher";
  app.innerHTML = `<div class="sign"><div class="exit-tab">TEACHER</div><div class="eyebrow">Road Trip USA · Unit 1</div><h2>Leaderboard: enter codes</h2></div><div class="card muted" id="tw">Checking access…</div>${footer()}`;
  await initCaps();
  if(!DB || !OWNER){ $("#tw").innerHTML = `This page is for the teacher who owns this game. Open it while you are signed in to Claude. <br><br><a href="#" id="home">Back to the game</a>`; $("#home").onclick=e=>{e.preventDefault(); location.hash=""}; return }
  $("#tw").outerHTML = `<div class="card" style="display:flex;flex-direction:column;gap:10px">
    <label for="codes"><b>Paste one or more codes</b> (one per line, e.g. LENA8B-3450-K7Q2). For each nickname only the best score is kept.</label>
    <textarea id="codes" rows="5" spellcheck="false" autocapitalize="characters"></textarea>
    <div class="row"><button class="btn" id="add">Add to leaderboard</button><a class="btn alt small" href="#board" style="text-decoration:none">Open beamer view</a><button class="btn alt small" id="clear">Clear leaderboard</button></div>
    <div class="log" id="log"></div>${LOCAL?`<p class="muted" style="margin:0;font-size:14px">The leaderboard is saved in this browser on this device. Use the same device and browser for the beamer view.</p>`:""}</div>
  <div class="board" id="tb"></div>`;
  drawTeacherBoard();
  $("#add").onclick=addCodes;
  let armed=0; $("#clear").onclick=async()=>{ const b=$("#clear"); if(Date.now()-armed>4000){ armed=Date.now(); b.textContent="Tap again to delete ALL entries"; b.classList.add("del","arm"); return }
    b.disabled=true; for(const r of BOARD){ try{ await DB.collection("board").doc(r.id).delete() }catch(e){} } b.disabled=false; b.textContent="Clear leaderboard"; b.classList.remove("del","arm"); toast("Leaderboard cleared") };
}
function drawTeacherBoard(){ const tb=$("#tb"); if(!tb) return; tb.innerHTML=boardRows(true);
  tb.querySelectorAll(".del").forEach(b=>b.onclick=async()=>{ if(!b.classList.contains("arm")){ b.classList.add("arm"); b.textContent="Sure?"; setTimeout(()=>{ if(b.isConnected){ b.classList.remove("arm"); b.textContent="Remove" } },3000); return }
    b.disabled=true; try{ await DB.collection("board").doc(b.dataset.id).delete() }catch(e){ toast("Could not remove – try again") } }); }
async function addCodes(){
  const lines=$("#codes").value.split(/\n|,|;/).map(s=>s.trim()).filter(Boolean); const log=$("#log"); log.innerHTML="";
  if(!lines.length){ toast("Paste at least one code."); return }
  $("#add").disabled=true;
  for(const l of lines){
    const p=parseCode(l);
    if(!p){ log.insertAdjacentHTML("beforeend",`<div class="no">✗ ${esc(l)} – not a valid code (format NAME-MILES-XXXX)</div>`); continue }
    if(p.bad){ log.insertAdjacentHTML("beforeend",`<div class="no">✗ ${esc(l)} – check digits don’t match (typo or changed miles?)</div>`); continue }
    const id=p.nick.toLowerCase(); const cur=BOARD.find(r=>r.id===id);
    if(cur && cur.score>=p.score){ log.insertAdjacentHTML("beforeend",`<div>• ${esc(p.nick)} already has ${cur.score} – kept the higher score</div>`); continue }
    try{ await DB.collection("board").doc(id).set({nick:p.nick, score:p.score, at:Date.now()}); log.insertAdjacentHTML("beforeend",`<div class="ok">✓ ${esc(p.nick)}: ${p.score} miles</div>`) }
    catch(e){ log.insertAdjacentHTML("beforeend",`<div class="no">✗ ${esc(p.nick)} – could not save (${esc(e?.code||"error")})</div>`) }
  }
  $("#add").disabled=false; $("#codes").value="";
}
async function renderBoard(){
  view="board";
  app.innerHTML = `<div class="sign"><div class="exit-tab">CLASS</div><div class="eyebrow">Road Trip USA · Unit 1</div><h1 style="font-size:clamp(32px,6vw,54px)">Leaderboard</h1></div><div id="bw" class="board beamer"><div class="card muted">Loading…</div></div>${footer()}`;
  await initCaps();
  if(!DB){ $("#bw").innerHTML=`<div class="card">Your teacher shows the class leaderboard in the lesson. Finish your trip and send your <b>code</b> to your teacher! <br><br><a href="#" id="home">Back to the game</a></div>`; $("#home").onclick=e=>{e.preventDefault(); location.hash=""}; return }
  drawBeamer();
}
function drawBeamer(){ const b=$("#bw"); if(b) b.innerHTML=boardRows(false) }

/* ================= ROUTER ================= */
function route(){
  const h=location.hash.replace("#","");
  if(h==="teacher") return renderTeacher();
  if(h==="board") return renderBoard();
  if(view==="teacher"||view==="board"||view==="start"){ S.nick ? go("map") : go("start") }
}
addEventListener("hashchange", route);
applyTOD(); fxInit(); sndBtn();
route();
</script>
